name: Release

on:
  push:
    tags: ['v*-rc*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing final tag vX.Y.Z, pointing at the approved candidate commit'
        required: true
        type: string
      project_result:
        description: 'Public project vote result URL (lists.apache.org/thread/...)'
        required: true
        type: string
      incubator_result:
        description: 'Public IPMC vote result URL (lists.apache.org/thread/...)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'apache/casbin-node-casbin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate mode and committed version
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PROJECT_RESULT: ${{ inputs.project_result }}
          INCUBATOR_RESULT: ${{ inputs.incubator_result }}
        run: |
          set -euo pipefail
          python .github/scripts/release.py meta "$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$PROJECT_RESULT" =~ ^https://lists\.apache\.org/thread/[a-z0-9]+$ ]]
            [[ "$INCUBATOR_RESULT" =~ ^https://lists\.apache\.org/thread/[a-z0-9]+$ ]]
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$ ]]
          fi
      - name: Refuse replacement of an existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo '::error::Release exists; assets will not be overwritten. Inspect partial publication before retrying.'
            exit 1
          fi
      - name: Export unsigned source candidate
        if: steps.meta.outputs.is_rc == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/release.py archive "$TAG"
      - name: Verify approved ASF originals against the final tag
        if: steps.meta.outputs.is_rc == 'false'
        env:
          TAG: ${{ inputs.tag }}
        run: python .github/scripts/release.py verify "$TAG"
      - uses: actions/setup-node@v4
        if: steps.meta.outputs.is_rc == 'false'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Check out pinned conformance fixtures
        if: steps.meta.outputs.is_rc == 'false'
        uses: actions/checkout@v4
        with:
          repository: apache/casbin
          ref: 8f5173b17bee2675025e7b46c9a8116ee352ec84
          path: casbin-conformance
          sparse-checkout: conformance
          persist-credentials: false
      - name: Build and test npm package from approved source
        if: steps.meta.outputs.is_rc == 'false'
        env:
          NAME: ${{ steps.meta.outputs.name }}
          CASBIN_CONFORMANCE_DIR: ${{ github.workspace }}/casbin-conformance/conformance
        run: |
          set -euo pipefail
          cd "dist-release/source/$NAME"
          yarn install --frozen-lockfile --ignore-scripts
          yarn lint
          yarn test --runInBand
          yarn build
          mkdir -p "$GITHUB_WORKSPACE/npm-package"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/npm-package"
          python "$GITHUB_WORKSPACE/.github/scripts/release.py" npm-check "$GITHUB_WORKSPACE"/npm-package/*.tgz
      - name: Publish approved-source npm package
        if: steps.meta.outputs.is_rc == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm-package/*.tgz --access public

      - name: Write release notes
        env:
          IS_RC: ${{ steps.meta.outputs.is_rc }}
          VERSION: ${{ steps.meta.outputs.version }}
          PROJECT_RESULT: ${{ inputs.project_result }}
          INCUBATOR_RESULT: ${{ inputs.incubator_result }}
        run: |
          printf 'Apache Casbin (Incubating) — Node-Casbin %s\n\n' "$VERSION" > release-notes.md
          cat DISCLAIMER >> release-notes.md
          if [[ "$IS_RC" == true ]]; then
            printf '\n\nUnsigned source candidate for review; the RM must sign and stage it before voting. This is not an approved release.\n' >> release-notes.md
          else
            printf '\n\nProject result: %s\nIPMC result: %s\nSource assets are the approved ASF originals.\n' "$PROJECT_RESULT" "$INCUBATOR_RESULT" >> release-notes.md
          fi
      - name: Create GitHub release without replacing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          IS_RC: ${{ steps.meta.outputs.is_rc }}
        run: |
          set -euo pipefail
          kind=(--latest)
          if [[ "$IS_RC" == true ]]; then kind=(--prerelease --latest=false); fi
          gh release create "$TAG" --title "$TAG (Apache Casbin Incubating)" --notes-file release-notes.md "${kind[@]}" dist-release/*.tar.gz dist-release/*.sha512 $(find dist-release -maxdepth 1 -name '*.asc' -print)
